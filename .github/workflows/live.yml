# Live checks against the public Zcash light servers (backend/test/zcash/live.test.ts), daily and on
# demand. The chain changes under Shade without a commit: a network upgrade the pinned scanner cannot
# parse, or a configured light server that stops answering, fails this job before a merchant notices.
name: live

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --project backend test/zcash/live
        env:
          SHADE_LIVE_TESTS: "1"
